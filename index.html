<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FreshVeggie Delivery</title>
    <meta name="description" content="A fresh vegetable delivery application allowing customers to browse, order, and track fresh produce deliveries." />
    
    <!-- Android / Chrome PWA Meta -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FreshVeggie" />
    
    <!-- iOS / Safari PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreshVeggie" />
    <meta name="format-detection" content="telephone=no" />

    <!-- OpenGraph -->
    <meta property="og:title" content="FreshVeggie Delivery" />
    <meta property="og:description" content="A fresh vegetable delivery application allowing customers to browse, order, and track fresh produce deliveries." />
    <meta property="og:type" content="website" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-gray-50 text-gray-900 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
