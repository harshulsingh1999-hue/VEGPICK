<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#22b573" />
      <stop offset="100%" stop-color="#046b3e" />
    </radialGradient>
    <linearGradient id="bagFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab676" />
      <stop offset="100%" stop-color="#c68642" />
    </linearGradient>
    <linearGradient id="bagSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b87635" />
      <stop offset="100%" stop-color="#8d5524" />
    </linearGradient>
  </defs>

  <!-- Squircle Backdrop -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <ellipse cx="256" cy="414" rx="145" ry="22" fill="#034c2b" opacity="0.45" />

  <!-- Broccoli (Top Center-Left) -->
  <g stroke="#14532d" stroke-width="6" stroke-linejoin="round">
    <path d="M210 218 L224 166 L252 168 L244 220 Z" fill="#86efac" />
    <circle cx="195" cy="145" r="32" fill="#22c55e" />
    <circle cx="228" cy="126" r="36" fill="#16a34a" />
    <circle cx="264" cy="144" r="30" fill="#22c55e" />
    <circle cx="228" cy="156" r="32" fill="#4ade80" stroke="none" opacity="0.55" />
  </g>

  <!-- Eggplant (Top Right) -->
  <g stroke="#3b0764" stroke-width="6" stroke-linejoin="round">
    <path d="M300 162 C318 128 345 112 356 122 C368 134 352 184 322 214 C298 236 276 218 282 194 Z" fill="#7e22ce" />
    <path d="M342 124 C346 108 358 106 360 118 L348 136 Z" fill="#22c55e" stroke="#14532d" stroke-width="4" />
  </g>

  <!-- Carrots (Left) -->
  <g stroke="#7c2d12" stroke-width="5" stroke-linejoin="round">
    <!-- Carrot Greens -->
    <path d="M138 175 C104 148 92 120 116 112 C132 126 144 150 148 172 Z" fill="#4ade80" stroke="#14532d" />
    <path d="M150 170 C134 134 134 102 154 102 C164 124 164 150 160 172 Z" fill="#22c55e" stroke="#14532d" />
    <!-- Carrot Body -->
    <path d="M132 174 C146 164 168 172 176 190 L198 242 L152 246 L128 196 C122 186 126 178 132 174 Z" fill="#f97316" />
  </g>

  <!-- Yellow Bell Pepper (Center) -->
  <g stroke="#854d0e" stroke-width="5" stroke-linejoin="round">
    <path d="M225 190 C225 170 250 166 260 176 C272 166 296 172 294 194 L288 236 L228 236 Z" fill="#facc15" />
    <path d="M258 174 C258 158 268 154 274 162" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Purple Grapes & Mint Leaves (Far Right) -->
  <g stroke="#4c1d95" stroke-width="4">
    <path d="M352 176 C376 154 402 162 396 186 C384 202 362 198 352 176 Z" fill="#4ade80" stroke="#14532d" />
    <circle cx="348" cy="196" r="14" fill="#9333ea" />
    <circle cx="370" cy="204" r="14" fill="#a855f7" />
    <circle cx="356" cy="220" r="14" fill="#7e22ce" />
    <circle cx="332" cy="212" r="13" fill="#a855f7" />
  </g>

  <!-- Red Apple & Ripe Orange (Front Row Right) -->
  <g>
    <!-- Orange -->
    <circle cx="330" cy="226" r="28" fill="#fb923c" stroke="#9a3412" stroke-width="5" />
    <!-- Red Apple -->
    <path d="M266 226 C264 200 288 196 298 204 C310 196 332 202 328 228 C324 252 308 260 296 256 C284 260 268 248 266 226 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="5" />
    <path d="M298 202 C304 186 318 184 320 194 C314 202 304 204 298 202 Z" fill="#4ade80" stroke="#14532d" stroke-width="4" />
  </g>

  <!-- Tomatoes (Front Left) -->
  <g stroke="#7f1d1d" stroke-width="5">
    <circle cx="205" cy="224" r="24" fill="#ef4444" />
    <circle cx="235" cy="236" r="22" fill="#dc2626" />
  </g>

  <!-- Kraft Paper Bag -->
  <g stroke="#5c3415" stroke-width="6" stroke-linejoin="round">
    <!-- Left Gusset Side -->
    <polygon points="130,224 190,236 190,414 130,388" fill="url(#bagSide)" />
    <polyline points="130,388 160,360 190,414" fill="none" stroke="#5c3415" stroke-width="4" />
    <!-- Front Panel -->
    <polygon points="190,236 376,224 382,394 190,414" fill="url(#bagFront)" />
  </g>

  <!-- Tomato Hanging Over Rim -->
  <g stroke="#7f1d1d" stroke-width="5">
    <circle cx="164" cy="264" r="23" fill="#ef4444" />
    <path d="M158 244 L164 254 L174 246 M164 254 L166 238" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Braided Rope Handle -->
  <path d="M242 258 C242 340 330 340 330 254" fill="none" stroke="#5c3415" stroke-width="14" stroke-linecap="round" />
  <path d="M242 258 C242 340 330 340 330 254" fill="none" stroke="#c68642" stroke-width="7" stroke-linecap="round" />

  <!-- Small Leaf Stamp on Bag Corner -->
  <g fill="#784212" opacity="0.85">
    <path d="M332 368 C332 354 344 346 354 346 C354 358 344 368 332 368 Z" />
    <path d="M330 370 C320 364 316 354 318 346 C326 348 332 358 330 370 Z" />
  </g>
</svg>